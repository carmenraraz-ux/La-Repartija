*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;color:var(--text);
  background:linear-gradient(var(--bg1),var(--bg2)) fixed;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
html{background:var(--bg1)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
input,select{font-size:16px}
.hidden{display:none !important}
svg{display:block}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--splash-bg);color:var(--splash-txt);transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-bar{width:150px;height:3px;border-radius:3px;background:rgba(128,128,128,.25);margin-top:34px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:30%;background:var(--accent-hi);border-radius:3px;animation:spbar 1.4s ease-in-out infinite}
@keyframes spbar{0%{margin-left:-30%}100%{margin-left:100%}}
.sp-txt{margin-top:18px;font-size:14px;letter-spacing:.12em}

/* ---------- logo (imagen original de La Repartija) ---------- */
.logo{display:flex;flex-direction:column;align-items:center}
.logo img.full{display:block;width:min(320px,78vw);height:auto;user-select:none;-webkit-user-drag:none}
.logo.sm{flex-direction:row;align-items:center;gap:10px}
.logo.sm img.mini{width:40px;height:40px;border-radius:10px;box-shadow:0 3px 10px rgba(217,119,43,.35);flex-shrink:0}
.logo.sm .wm{font-size:17px;font-weight:600;letter-spacing:.14em;white-space:nowrap;background:linear-gradient(90deg,#C8641A,#F5A25D);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
html[data-theme="dark"] .logo.sm .wm{background:linear-gradient(90deg,#FFB067,#FFD2A3);-webkit-background-clip:text;background-clip:text}
.topbrand{display:none;align-items:center;gap:8px;margin-right:auto;font-weight:700;letter-spacing:.1em;font-size:14px;color:var(--accent)}
.topbrand img{width:30px;height:30px;border-radius:8px;box-shadow:0 2px 8px rgba(217,119,43,.3)}
.topbrand{white-space:nowrap}
@media(max-width:860px){.topbrand{display:flex}}
@media(max-width:520px){.topbrand span{display:none}#fechaPill{white-space:nowrap;font-size:12px}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--lg-bg);padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
.lg-wrap{width:100%;max-width:380px;max-height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;color:var(--lg-lbl)}
.lg-wrap::-webkit-scrollbar{display:none}
.lg-wrap>*{flex-shrink:0}
.lg-wrap{margin:auto 0}
#login{overflow-y:auto;align-items:flex-start}
.lg-wrap .logo{margin-bottom:26px}
.lg-wrap h1{margin:0;font-size:24px;color:var(--lg-h1)}
.lg-wrap p.s{margin:4px 0 18px;color:var(--lg-sub);font-size:14px}
.lg-who{width:100%}
.lg-who>span{display:block;font-size:14px;color:var(--lg-lbl);margin-bottom:8px}
#lgUsers{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;width:100%;min-height:58px}
#lgUsers button.u{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--lg-line);background:var(--lg-chip);color:var(--lg-chip-txt);font-weight:700;font-size:15px;text-align:left;transition:all .15s}
#lgUsers button.u .ini{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.18);font-weight:800;font-size:13px}
#lgUsers button.u.on{background:var(--lg-chip-on);color:var(--lg-chip-ontxt);border-color:var(--lg-bd1);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
#lgUsers button.u.on .ini{background:var(--lg-bd1);color:#fff}
#lgUsers .ld{grid-column:1/-1;text-align:center;padding:16px;color:var(--lg-sub);font-size:13.5px}
#login .fl{width:100%;margin-top:16px}
#login label{display:block;font-size:14px;color:var(--lg-lbl);margin-bottom:8px}
.pwf{position:relative}
.pwf input{width:100%;padding:15px 48px 15px 16px;border-radius:14px;border:1.5px solid var(--lg-line);background:var(--lg-field);color:var(--lg-in);outline:none;letter-spacing:.2em;transition:border-color .15s,box-shadow .15s}
.pwf input:focus{border-color:var(--lg-bd1);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.pwf button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--lg-eye);display:flex;align-items:center;justify-content:center;border-radius:10px}
.glow{width:100%;margin-top:22px;padding:15px;border-radius:999px;border:2px solid transparent;color:var(--lg-btntxt);font-weight:700;font-size:16px;
  background:linear-gradient(var(--lg-btnbg),var(--lg-btnbg)) padding-box,linear-gradient(90deg,var(--lg-bd1),var(--lg-bd2)) border-box;transition:transform .1s,opacity .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.glow:active{transform:scale(.98)}.glow:disabled{opacity:.6}.glow:hover{box-shadow:0 0 22px rgba(var(--accent-rgb),.28)}
#loginMsg{min-height:20px;margin-top:12px;font-size:13px;color:var(--lg-err);text-align:center}

try { S.user = JSON.parse(localStorage.getItem('md_user') || 'null'); } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

const sgn = n => n < -0.004 ? 'neg' : '';
const pad = x => String(x).padStart(2, '0');
const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoyISO = () => isoDe(new Date());
const fCorta = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] : ''; };

/* ===================== TEMA ===================== */
function aplicarTema(m) {
  localStorage.setItem('md_theme', m);
  const dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  { const mm = MARCAS[marcaActual()]; $('metaTheme').setAttribute('content', dark ? mm.metaDark : mm.metaLight); }
  document.querySelectorAll('#thmSide button').forEach(b => b.classList.toggle('on', b.dataset.th === m));
  $('btnTema').innerHTML = ic(dark ? 'moon' : 'sun');
}
const temaActual = () => localStorage.getItem('md_theme') || 'dark';
document.querySelectorAll('#thmSide button').forEach(b => b.addEventListener('click', () => aplicarTema(b.dataset.th)));
$('btnTema').addEventListener('click', () => aplicarTema(({ dark: 'light', light: 'auto', auto: 'dark' })[temaActual()]));
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (temaActual() === 'auto') aplicarTema('auto'); });

const MARCAS = {
  repartija: { nombre: 'La Repartija', splash: 'Abriendo La Repartija…', titulo: 'La Repartija · Caja familiar', metaDark: '#1d120a', metaLight: '#FFF8F1',
    logo: '<img class="full" alt="La Repartija · Caja familiar, cuentas claras" src="' + IMG_LOGO + '">',
    logoSm: '<img class="mini" alt="" src="' + IMG_MINI + '"><span class="wm">LA REPARTIJA</span>' }
};
const marcaActual = () => 'repartija';
function pintarLogos() {
  const m = MARCAS[marcaActual()];
  document.querySelectorAll('.brandlogo').forEach(el => {
    const sm = el.classList.contains('sm');
    el.classList.add('rp');
    el.innerHTML = sm ? m.logoSm : m.logo;
  });
}
function aplicarMarca(k) {
  k = k === 'repartija' ? 'repartija' : 'dinero';
  try { localStorage.setItem('md_brand', k); } catch (e) {}
  document.documentElement.setAttribute('data-brand', k);
  const m = MARCAS[k]; document.title = m.titulo; $('spTxt').textContent = m.splash;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('metaTheme').setAttribute('content', dark ? m.metaDark : m.metaLight);
  pintarLogos();
  if (!$('login').classList.contains('hidden')) document.documentElement.style.background = MARCAS_PAGE[k];
}
const MARCAS_PAGE = { dinero: '#050b0d', repartija: '#FFB26B' };

/* ===================== AVISOS Y PROGRESO ===================== */
function toast(msg, type = 'info') {
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = `${ic({ success: 'check', info: 'info', warning: 'alert', error: 'xc' }[type], 20)}<span style="flex:1">${esc(msg)}</span>`;
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); t.addEventListener('animationend', () => t.remove()); }, type === 'error' ? 4600 : 2600);
}
function progStart() { S.busy++; const b = $('prog'); b.style.opacity = 1; b.style.width = '30%'; setTimeout(() => { if (S.busy) b.style.width = '72%'; }, 250); $('icRef').classList.add('spin'); }
function progDone() { S.busy = Math.max(0, S.busy - 1); if (S.busy) return; const b = $('prog'); b.style.width = '100%'; setTimeout(() => { b.style.opacity = 0; b.style.width = '0'; }, 220); $('icRef').classList.remove('spin'); }
function estado(tipo, txt) { const e = $('estado'); e.className = 'st' + (tipo === 'ok' ? '' : tipo === 'wait' ? ' wait' : ' err'); e.lastElementChild.textContent = txt; $('uEstado').textContent = txt; }


/* ===================== API ===================== */
async function api(action, datos = {}) {
  progStart();
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: API_KEY }, datos)), signal: ctrl.signal });
    const txt = await res.text(); let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('El servidor respondió algo que no es JSON. Revisa que el Web App esté implementado con acceso "Cualquier persona" y que uses la URL /exec.'); }
    if (!j.ok) throw new Error(j.error || 'Error');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Tardó demasiado. Revisa tu conexión e inténtalo otra vez.');
    if (e instanceof TypeError) throw new Error('Sin conexión con el servidor.');
    throw e;
  } finally { clearTimeout(timer); progDone(); }
}
async function call(action, datos) {
  try { const j = await api(action, datos); estado('ok', 'Conectado'); return j; }
  catch (e) { estado('err', 'Sin conexión'); throw e; }
}

/* ===================== SESIÓN ===================== */

/* ===================== DATOS ===================== */
async function cargar() {
  const id = ++S.seq;
  try { const j = await call('estado'); if (id !== S.seq) return; setData(j.data); }
  catch (e) { if (id !== S.seq) return; toast(e.message, 'error'); if (!S.data) errorVista(e.message); }
}
function setData(d) { S.data = d; S.ultima = Date.now(); estado('ok', 'Conectado'); renderTodo(); }
function errorVista(msg) {
  const h = `<div class="card" style="text-align:center"><div class="chipi warn" style="margin:0 auto 12px">${ic('alert', 22)}</div><p class="hint">${esc(msg)}</p><button class="glow" style="max-width:200px;margin:14px auto 0" onclick="cargar()">Reintentar</button></div>`;
  ['vInicio', 'vSobres', 'vCuentas', 'vMovs'].forEach(k => $(k).innerHTML = h);
}
const sk = (n, h) => Array.from({ length: n }, () => `<div class="skel" style="height:${h}px"></div>`).join('');
function skeletons() { $('vInicio').innerHTML = sk(1, 56) + sk(1, 150) + sk(1, 130) + sk(3, 96); $('vSobres').innerHTML = sk(6, 78); $('vCuentas').innerHTML = sk(3, 150); $('vMovs').innerHTML = sk(6, 66); }

/* ===================== NAVEGACIÓN ===================== */
function ir(v, sinAnim) {
  S.vista = v;
  ['inicio', 'sobres', 'registrar', 'cuentas', 'movs'].forEach(x => { const s = $('v-' + x); s.classList.toggle('on', x === v); });
  if (!sinAnim) { const s = $('v-' + v); s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('titulo').textContent = TITULOS[v]; window.scrollTo({ top: 0 });
}

/* ---- movimientos */
function listaMovs(arr, acc) {
  if (!arr.length) return '<p class="hint" style="text-align:center;padding:26px 0">Aún no hay movimientos.</p>';
  return '<div class="stack">' + arr.map(m => {
    const ing = m.tipo === 'Ingreso' || m.tipo === 'Saldo inicial', tr = m.tipo === 'Traslado', deu = m.tipo === 'Pago deuda';
    const icn = ing ? 'down' : tr ? 'repeat' : deu ? 'clock' : 'up', cl = ing ? 'pos' : tr ? '' : 'neg';
    const det = tr ? `${esc(m.origen)} → ${esc(m.destino)}` : deu ? `${esc(m.origen)} → Deuda` : ing ? 'Repartido en bolsas' : esc(m.origen);
    const extra = [m.metodo, m.quien].filter(Boolean).map(esc).join(' · ');
    return `<div class="row"><div class="chipi sm ${cl}">${ic(icn, 20)}</div><div class="m"><b>${esc(m.desc || m.tipo)}</b><small>${fCorta(m.fecha)} · ${det}${extra ? ' · ' + extra : ''}</small></div><div class="a ${cl}">${ing ? '+' : tr ? '' : '−'}${fmt(m.monto)}</div>${acc ? `${m.tipo === 'Saldo inicial' ? '' : `<button class="x" data-ed="${esc(m.id)}" aria-label="Editar">${ic('edit', 18)}</button>`}<button class="x" data-del="${esc(m.id)}" aria-label="Anular">${ic('trash', 18)}</button>` : ''}</div>`;
  }).join('') + '</div>';
}
const TF = { Todos: null, Gastos: 'Gasto', Ingresos: 'Ingreso', Traslados: 'Traslado', Deudas: 'Pago deuda' };
function renderMovs() {
  const d = S.data, chip = (k, lista, cur) => `<div class="chips">${lista.map(t => `<button data-k="${k}" data-x="${t}" class="${cur === t ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  const arr = d.historial.filter(m => (!TF[S.ft] || m.tipo === TF[S.ft]) && (S.fq === 'Todos' || m.quien === S.fq) && (S.fm === 'Todos' || m.metodo === S.fm));
  const gas = r2(arr.filter(m => m.tipo === 'Gasto').reduce((a, m) => a + m.monto, 0));
  $('vMovs').innerHTML = chip('ft', Object.keys(TF), S.ft) + chip('fq', ['Todos', ...USUARIOS.map(u => u.nombre)], S.fq) + chip('fm', ['Todos', ...METODOS], S.fm) +
    `<div class="sech"><span>${arr.length} movimiento${arr.length === 1 ? '' : 's'}</span><span class="neg">${gas > 0 ? 'Gastos −' + fmt(gas) : ''}</span></div>` + listaMovs(arr, true);
}
$('vMovs').addEventListener('click', async e => {
  const k = e.target.closest('[data-k]'); if (k) { S[k.dataset.k] = k.dataset.x; renderMovs(); hidratar(); return; }
  const dl = e.target.closest('[data-del]'), ed = e.target.closest('[data-ed]'), id = (dl || ed || {}).dataset && (dl ? dl.dataset.del : ed.dataset.ed); if (!id) return;
  const m = S.data.historial.find(x => x.id === id); if (!m) return;
  if (ed) { editarDlg(m); return; }
  const extra = m.tipo === 'Ingreso' ? ' Se quitará de todas las bolsas.' : m.tipo === 'Pago deuda' ? ' La deuda volverá a subir y el dinero regresa a las bolsas.' : ' El dinero vuelve a la bolsa.';
  if (!await confirmar('¿Anular este movimiento?', `${m.desc || m.tipo} · ${fmt(m.monto)} (${fCorta(m.fecha)}).${extra} No se puede deshacer.`, 'Anular')) return;
  try { const j = await call('anular', { id }); S.seq++; setData(j.resumen); toast('Movimiento anulado', 'success'); }
  catch (er) { toast(er.message, 'error'); }
});
function editarDlg(m) {
  const box = document.querySelector('#modal .box'), orig = box.innerHTML, d = S.data, T = m.tipo;
  const f = (l, inner) => `<div class="fld" style="margin-top:12px"><label>${l}</label>${inner}</div>`;
  const quien = USUARIOS.map(u => `<option>${u.nombre}</option>`).join(''), metodo = '<option value="">—</option>' + METODOS.map(x => `<option>${x}</option>`).join('');
  let h = `<h3>Editar ${esc(T.toLowerCase())}</h3>`;
  if (T !== 'Pago deuda') h += f('Monto (S/)', `<input id="eMonto" type="text" inputmode="decimal" value="${m.monto}">`);
  if (T === 'Gasto') h += f('Bolsa', `<select id="eBolsa">${optG(d.bolsas, true)}</select>`);
  if (T === 'Traslado') h += f('Desde', `<select id="eOrigen">${optG(d.bolsas, true)}</select>`) + f('Hacia', `<select id="eDestino">${optG(d.bolsas, true)}</select>`);
  h += `<div class="two">${f('Fecha', `<input id="eFecha" type="date" value="${esc(m.fecha)}">`)}${f('Quién', `<select id="eQuien">${quien}</select>`)}</div>`;
  if (T === 'Gasto' || T === 'Pago deuda') h += f('Método de pago', `<select id="eMetodo">${metodo}</select>`);
  if (T !== 'Ingreso') h += f('Descripción', `<input id="eDesc" type="text" maxlength="120" value="${esc(m.desc)}">`);
  if (T === 'Ingreso') h += '<p class="hint" style="margin:12px 0 0">Si cambias el monto, el ingreso se vuelve a repartir en las bolsas.</p>';
  if (T === 'Pago deuda') h += '<p class="hint" style="margin:12px 0 0">Para cambiar el monto del abono, anúlalo y regístralo de nuevo.</p>';
  h += '<div class="bt" style="margin-top:16px"><button id="eNo">Cancelar</button><button id="eSi" class="ok" style="background:var(--accent);border-color:var(--accent)">Guardar</button></div>';
  box.innerHTML = h; box.style.maxHeight = '88vh'; box.style.overflowY = 'auto'; $('modal').classList.remove('hide');
  if ($('eBolsa')) $('eBolsa').value = m.bo; if ($('eOrigen')) { $('eOrigen').value = m.bo; $('eDestino').value = m.bd; }
  $('eQuien').value = m.quien || S.user.nombre; if ($('eMetodo')) $('eMetodo').value = m.metodo || '';
  const cerrar = () => { $('modal').classList.add('hide'); setTimeout(() => { box.innerHTML = orig; box.style.maxHeight = ''; box.style.overflowY = ''; }, 250); };
  $('eNo').onclick = cerrar;
  $('eSi').onclick = async () => {
    const p = { id: m.id, fecha: $('eFecha').value, registrado_por: $('eQuien').value };
    if ($('eMonto')) { p.monto = num($('eMonto').value); if (!(p.monto > 0)) { toast('Escribe un monto mayor a 0', 'warning'); return; } }
    if ($('eBolsa')) p.bolsa = $('eBolsa').value;
    if ($('eOrigen')) { p.origen = $('eOrigen').value; p.destino = $('eDestino').value; }
    if ($('eMetodo')) p.metodo_pago = $('eMetodo').value;
    if ($('eDesc')) p.concepto = $('eDesc').value.trim();
    const b = $('eSi'); b.disabled = true; b.textContent = 'Guardando…';
    try { const j = await call('editar', p); S.seq++; setData(j.resumen); cerrar(); toast('Movimiento actualizado', 'success'); }
    catch (er) { b.disabled = false; b.textContent = 'Guardar'; toast(er.message, 'error'); }
  };
}

/* ===================== MODAL ===================== */
function confirmar(t, p, ok) {
  return new Promise(res => {
    $('mT').textContent = t; $('mP').textContent = p; $('mSi').textContent = ok || 'Confirmar'; $('modal').classList.remove('hide');
    const fin = v => { $('modal').classList.add('hide'); $('mSi').onclick = $('mNo').onclick = null; res(v); };
    $('mSi').onclick = () => fin(true); $('mNo').onclick = () => fin(false);
  });
}

/* ===================== FORMULARIO ===================== */
const optG = (lista, conSaldo) => { const g = {}; lista.forEach(b => (g[b.grupo] = g[b.grupo] || []).push(b)); return Object.keys(g).map(k => `<optgroup label="${esc(GR_NOM[k] || k)}">${g[k].map(b => `<option value="${esc(b.id_bolsa)}">${esc(b.nombre_bolsa)}${conSaldo ? ' · ' + fmt(b.saldo) : ''}</option>`).join('')}</optgroup>`).join(''); };
function llenarEstaticos() {
  $('fQuien').innerHTML = USUARIOS.map(u => `<option>${u.nombre}</option>`).join(''); $('fQuien').value = S.user.nombre;
  $('fPago').innerHTML = METODOS.map(m => `<option>${m}</option>`).join(''); $('fPago').value = localStorage.getItem('md_pago') || 'Yape';
}
function llenarSelects() {
  const d = S.data, keep = id => $(id).value, set = (id, html, v) => { $(id).innerHTML = html; if (v && [...$(id).options].some(o => o.value === v)) $(id).value = v; };
  const pB = keep('fBolsa'), pO = keep('fOrigen'), pD = keep('fDestino'), pF = keep('fFuente'), pDe = keep('fDeuda');
  set('fBolsa', '<option value="">Elige una bolsa…</option>' + optG(d.bolsas.filter(b => b.cuenta === 'BCP'), false) + optG(d.bolsas.filter(b => b.cuenta === 'WAYKI'), false), pB);
  set('fOrigen', optG(d.bolsas, true), pO); set('fDestino', optG(d.bolsas, true), pD || 'B02');
  if (!pD) $('fDestino').value = 'B02';
  set('fFuente', d.ingresos.map(f => `<option value="${f.id_fuente}">${esc(f.fuente_ingreso)} · ${esc(f.banco_recepcion)}</option>`).join(''), pF);
  set('fDeuda', d.deudas.filter(x => x.estado === 'ACTIVA').map(x => `<option value="${esc(x.id_deuda)}">${esc(x.nombre_prestamo)} · ${fmt(x.saldo_pendiente)}</option>`).join('') || '<option value="">Sin deudas activas</option>', pDe);
  const act = ['B02', 'B03', 'B06'].map(bol).filter(Boolean), keepV = {}; document.querySelectorAll('.abi').forEach(i => keepV[i.dataset.b] = i.value);
  $('abIn').innerHTML = '<div class="hint" style="margin-top:10px">Retira a la vez de varias bolsas de Wayki:</div>' + d.bolsas.filter(b => ['B01', 'B02', 'B03', 'B06'].includes(b.id_bolsa) && b.id_bolsa !== 'B01').map(b => `<div class="fld" style="margin-top:10px"><label>${esc(b.nombre_bolsa)} · disp. ${fmt(b.saldo)}</label><input class="abi" data-b="${b.id_bolsa}" type="text" inputmode="decimal" placeholder="0.00" value="${keepV[b.id_bolsa] || ''}"></div>`).join('');
  document.querySelectorAll('.abi').forEach(i => i.addEventListener('input', actualizarForm));
}
function setTipo(t) {
  S.tipo = t; S.res = null;
  document.querySelectorAll('#segTipo button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const v = (id, on) => $(id).classList.toggle('hidden', !on);
  v('rBolsa', t === 'Gasto'); v('rFuente', t === 'Ingreso'); v('rOrigen', t === 'Mover'); v('rDestino', t === 'Mover'); v('rDeuda', t === 'Pago deuda');
  v('rPago', t === 'Gasto' || t === 'Pago deuda'); v('rMonto', t !== 'Pago deuda'); v('rRes', false);
  $('btnGuardar').textContent = { Gasto: 'Guardar gasto', Ingreso: 'Guardar ingreso', Mover: 'Mover dinero', 'Pago deuda': 'Confirmar abono a deuda' }[t];
  if (t === 'Ingreso' && S.data) ponerMontoFuente();
  actualizarForm();
}
function ponerMontoFuente() { const f = S.data.ingresos.find(x => x.id_fuente == $('fFuente').value); if (f) $('fMonto').value = f.monto_base; }
document.querySelectorAll('#segTipo button').forEach(b => b.addEventListener('click', () => setTipo(b.dataset.t)));
const num = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) ? r2(n) : 0; };
const montoForm = () => num($('fMonto').value);
const partesAb = () => [...document.querySelectorAll('.abi')].map(i => ({ bolsa: i.dataset.b, monto: num(i.value) }));
function actualizarForm() {
  const d = S.data; if (!d) return; const m = montoForm(), h = $('hBolsa'), pv = $('prev');
  h.textContent = ''; h.style.color = ''; pv.classList.add('hidden');
  if (S.tipo === 'Gasto') {
    const b = bol($('fBolsa').value);
    if (b) { const q = r2(b.saldo - m); h.textContent = m > 0 ? `Queda ${fmt(b.saldo)} → quedaría ${fmt(q)}` + (q < 0 ? ' · no alcanza, usa Mover primero' : '') : `Queda ${fmt(b.saldo)} · gastado ${Math.round(usoDe(b))}% del mes`; if (q < 0 && m > 0) h.style.color = 'var(--warn)'; }
  } else if (S.tipo === 'Pago deuda') {
    const dd = d.deudas.find(x => x.id_deuda === $('fDeuda').value), tot = r2(partesAb().reduce((a, p) => a + p.monto, 0));
    if (dd) { pv.classList.remove('hidden'); pv.innerHTML = `<div class="r"><span class="dim">Deuda pendiente</span><b>${fmt(dd.saldo_pendiente)}</b></div><div class="r"><span class="dim">Total del abono</span><b>${fmt(tot)}</b></div>${tot > 0 ? `<div class="r"><span class="dim">Después del abono</span><b>${fmt(r2(dd.saldo_pendiente - tot))}</b></div>` : ''}`; }
  } else if (S.tipo === 'Ingreso' && m > 0) {
    const g = {}; d.bolsas.forEach(b => g[b.grupo] = (g[b.grupo] || 0) + b.pct_global * m);
    const f = d.ingresos.find(x => x.id_fuente == $('fFuente').value), wk = r2(d.bolsas.filter(b => b.cuenta === 'WAYKI').reduce((a, b) => a + b.pct_global * m, 0));
    pv.classList.remove('hidden');
    pv.innerHTML = '<div class="lbl" style="margin-bottom:6px">Se repartirá así</div>' + [['Nana', g.NANA], ['Largo plazo', g.LARGO_PLAZO], ['Casa · BCP', g.CASA_OPERATIVO], ['Servicios · Wayki', g.CASA_SERVICIOS], ['Pasajes', g.PASAJES]].map(x => `<div class="r"><span class="dim">${x[0]}</span><b>${fmt(x[1])}</b></div>`).join('') + `<div class="r" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:8px"><span class="dim">Irá a Wayki</span><b>${fmt(wk)}</b></div>`;
  }
  renderRes();
}
function renderRes() {
  const r = $('rRes'); if (!S.res || S.tipo !== 'Ingreso') { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  r.innerHTML = '<div class="lbl" style="margin-bottom:4px">Ahora haz estas transferencias</div>' + S.res.map(p => `<div class="stp"><div class="n">${p.n}</div><div>${esc(p.texto)}${p.detalle ? `<div class="hint" style="font-size:12.5px">${Object.entries(p.detalle).map(([k, v]) => esc(k) + ' ' + fmt(v)).join(' · ')}</div>` : ''}</div><div class="b">${fmt(p.monto)}</div></div>`).join('');
}
$('fMonto').addEventListener('input', actualizarForm); $('fBolsa').addEventListener('change', actualizarForm); $('fDeuda').addEventListener('change', actualizarForm);
$('fFuente').addEventListener('change', () => { ponerMontoFuente(); S.res = null; actualizarForm(); });
async function guardar() {
  if (S.guardando) return;
  const fecha = $('fFecha').value; if (!fecha) { toast('Elige la fecha', 'warning'); return; }
  const base = { fecha, registrado_por: $('fQuien').value, metodo_pago: ($('rPago').classList.contains('hidden') ? '' : $('fPago').value) };
  const m = montoForm(), desc = $('fDesc').value.trim(); let accion, p, ok;
  if (S.tipo === 'Gasto') {
    if (!(m > 0)) { toast('Escribe un monto mayor a 0', 'warning'); $('fMonto').focus(); return; }
    if (!$('fBolsa').value) { toast('Elige una bolsa', 'warning'); return; }
    accion = 'gasto'; p = { ...base, bolsa: $('fBolsa').value, monto: m, concepto: desc }; ok = 'Gasto guardado';
  } else if (S.tipo === 'Ingreso') {
    if (!(m > 0)) { toast('Escribe un monto mayor a 0', 'warning'); return; }
    accion = 'ingreso'; p = { ...base, id_fuente: $('fFuente').value, monto: m }; ok = 'Ingreso guardado y repartido';
  } else if (S.tipo === 'Mover') {
    if (!(m > 0)) { toast('Escribe un monto mayor a 0', 'warning'); return; }
    if ($('fOrigen').value === $('fDestino').value) { toast('Origen y destino deben ser distintos', 'warning'); return; }
    accion = 'traslado'; p = { ...base, origen: $('fOrigen').value, destino: $('fDestino').value, monto: m, motivo: desc }; ok = 'Dinero movido';
  } else {
    const partes = partesAb().filter(x => x.monto > 0); if (!partes.length) { toast('Indica al menos un monto', 'warning'); return; }
    accion = 'abono'; p = { ...base, id_deuda: $('fDeuda').value, partes, nota: desc }; ok = 'Abono a deuda guardado';
  }
  S.guardando = true; const b = $('btnGuardar'), txt = b.textContent; b.disabled = true; b.innerHTML = `<span class="spin">${ic('refresh', 18)}</span> Guardando…`;
  try {
    const j = await call(accion, p); S.seq++;
    if (p.metodo_pago) localStorage.setItem('md_pago', p.metodo_pago);
    $('fMonto').value = ''; $('fDesc').value = ''; document.querySelectorAll('.abi').forEach(i => i.value = '');
    S.res = accion === 'ingreso' ? j.data.pasos : null; setData(j.resumen); toast(ok, 'success'); if (accion === 'gasto') $('fMonto').focus();
  } catch (e) { toast(e.message, 'error'); }
  finally { S.guardando = false; b.disabled = false; b.textContent = txt; }
}
$('btnGuardar').addEventListener('click', guardar); $('fDesc').addEventListener('keydown', e => { if (e.key === 'Enter') guardar(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.data && Date.now() - S.ultima > 45000) cargar(); });

/* ===================== ARRANQUE ===================== */
document.querySelectorAll('.tbimg').forEach(i => i.src = IMG_MINI);
hidratar(); aplicarMarca(marcaActual()); aplicarTema(temaActual()); $('fFecha').value = hoyISO();
document.querySelectorAll('#segTipo button')[0].classList.add('on'); S.tipo = 'Gasto';
setTimeout(() => { if (S.user) abrirApp(); else mostrarLogin(); }, 900);
</script>
</body>
